<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ollama-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#ollama-bg)"/>

  <!-- Llama silhouette simplified -->
  <ellipse cx="64" cy="58" rx="28" ry="24" fill="white" opacity="0.95"/>
  <ellipse cx="64" cy="82" rx="20" ry="16" fill="white" opacity="0.95"/>

  <!-- Ears -->
  <ellipse cx="46" cy="38" rx="8" ry="14" fill="white" opacity="0.95" transform="rotate(-15 46 38)"/>
  <ellipse cx="82" cy="38" rx="8" ry="14" fill="white" opacity="0.95" transform="rotate(15 82 38)"/>

  <!-- Eyes -->
  <circle cx="54" cy="54" r="4" fill="#059669"/>
  <circle cx="74" cy="54" r="4" fill="#059669"/>

  <!-- Nose -->
  <ellipse cx="64" cy="68" rx="6" ry="4" fill="#059669" opacity="0.6"/>

  <!-- AI sparkle -->
  <circle cx="100" cy="28" r="6" fill="#ffd700"/>
  <circle cx="100" cy="28" r="3" fill="white"/>
</svg>
